[project]
name = "do-it-bot"
version = "0.1.0"
description = "Telegram Reminder Bot with Persian NLP, Jalali & Gregorian calendar support"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue,socks]>=22.8",
    "jdatetime>=6.1.1",
    "pytz>=2026.5",
    "aiosqlite>=0.22.1",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

